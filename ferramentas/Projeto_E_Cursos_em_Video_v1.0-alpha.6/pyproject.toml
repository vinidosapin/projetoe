[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto-e-cursos-em-video"
version = "1.0.0a6"
description = "Pipeline auditável que transforma fontes e objetivos em cursos por vídeos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
automation = ["yt-dlp>=2026.8.19"]

[project.scripts]
projeto-e-video = "projeto_e_video.cli:main"

[tool.setuptools]
packages = ["projeto_e_video"]
